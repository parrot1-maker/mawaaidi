<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مواعيدي</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cairo:wght@400;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f3f0;--sf:#fbfcfb;--tx:#243230;--mu:#75827e;--ac:#4f8a7b;--ax:#fff;--bd:#dde3df;--tr:#e4ebe7;--ez:cubic-bezier(.2,.8,.2,1);color-scheme:light}

:root[data-theme=sage]{--bg:#f1f3f0;--sf:#fbfcfb;--tx:#243230;--mu:#75827e;--ac:#4f8a7b;--ax:#fff;--bd:#dde3df;--tr:#e4ebe7;color-scheme:light}
:root[data-theme=dusk]{--bg:#14181f;--sf:#1c222c;--tx:#e6e9ee;--mu:#8b95a5;--ac:#8fb4d9;--ax:#101722;--bd:#2a313d;--tr:#252c37;color-scheme:dark}
:root[data-theme=lav]{--bg:#f1eff5;--sf:#fbfafd;--tx:#2b2838;--mu:#7d7890;--ac:#7b6fb5;--ax:#fff;--bd:#e1deea;--tr:#e8e5f0;color-scheme:light}
:root[data-theme=sea]{--bg:#0f1b1f;--sf:#162a2f;--tx:#dff0ee;--mu:#86a9a8;--ac:#6cc2b5;--ax:#0b1a1d;--bd:#24414a;--tr:#1f3a40;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{min-height:100%;background:var(--bg);color:var(--tx);font-family:var(--ff,Tajawal),system-ui,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0px) 0 0;overflow-x:hidden;transition:background .6s,color .6s}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .2s var(--ez),background .3s,color .3s,border-color .3s,opacity .3s}
button:active{transform:scale(.94)}
.i{display:block;flex:none}
.bgf{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.bgf i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;background:radial-gradient(circle,var(--ac),transparent 65%);opacity:.13;filter:blur(30px);animation:drift 24s ease-in-out infinite alternate}
.bgf i:nth-child(1){top:-26vmax;inset-inline-start:-22vmax}
.bgf i:nth-child(2){bottom:-32vmax;inset-inline-end:-26vmax;animation-delay:-9s;animation-duration:30s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.18)}}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:16px 18px 190px;zoom:var(--fs,1)}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
header small{color:var(--mu);font-size:13px}h1{font-size:26px;font-weight:800;letter-spacing:-.3px}
.av{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ac);background:var(--sf);font-weight:800;font-size:18px;color:var(--ac)}
.sb{position:relative;margin-bottom:16px}.sb .i{position:absolute;top:50%;margin-top:-9px;inset-inline-start:14px;color:var(--mu)}.sb input{padding-inline-start:42px}
.hero{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r,28px);padding:20px;display:flex;align-items:center;gap:18px;margin-bottom:8px;transition:box-shadow .6s}
.hero.hot{box-shadow:0 0 0 1px var(--ac),0 0 34px color-mix(in srgb,var(--ac) 30%,transparent);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 1px var(--ac),0 0 12px color-mix(in srgb,var(--ac) 15%,transparent)}}
.ring{position:relative;width:122px;height:122px;flex:none}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .t{stroke:var(--tr)}.ring .p{stroke:var(--ac);transition:stroke-dashoffset 1.6s var(--ez);filter:drop-shadow(0 0 5px color-mix(in srgb,var(--ac) 50%,transparent))}
.ring b{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:20px;font-weight:800;line-height:1.25;padding:0 14px}
.ring small{display:block;font-size:12px;font-weight:500;color:var(--mu)}
.hi{min-width:0}.hi .k{font-size:13px;color:var(--mu);margin-bottom:4px}
.hi h2{font-size:20px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}.hi p{font-size:14px;color:var(--mu);margin-top:6px}
.day{font-size:13px;font-weight:700;color:var(--mu);margin:20px 4px 10px}
.it{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--bd);border-radius:calc(var(--r,28px)*.7);padding:calc(var(--gp,10px)*1.1) 12px;margin-bottom:var(--gp,10px);transition:opacity .4s,transform .2s var(--ez),border-color .3s}
.it:hover{border-color:var(--ac)}.it:active{transform:scale(.985)}
.it.out{animation:out .32s var(--ez) forwards}
@keyframes out{to{opacity:0;transform:translateX(-40px) scale(.95);max-height:0;margin:0;padding-block:0}}
.ck{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--bd);background:none;flex:none;display:grid;place-items:center;color:var(--ax)}
.ck svg{width:16px;height:16px}.ck path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .4s var(--ez) .1s}
.it.done .ck{background:var(--ac);border-color:var(--ac)}.it.done .ck path{stroke-dashoffset:0}
.it .ic{width:42px;height:42px;border-radius:13px;background:var(--tr);display:grid;place-items:center;color:var(--ac);flex:none}
.it .m{flex:1;min-width:0}.it .m b{display:block;font-size:16px;font-weight:700;overflow-wrap:anywhere}
.it .m span{font-size:13px;color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.done{opacity:.45}.it.done b{text-decoration:line-through}.it.late .m span{color:var(--ac);font-weight:700}
.empty{text-align:center;color:var(--mu);padding:26px 10px;font-size:15px;line-height:1.9}
.empty .i{margin:0 auto 8px;color:var(--ac);opacity:.7;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nc{border-radius:calc(var(--r,28px)*.7);padding:14px;min-height:110px;cursor:pointer;border:1px solid var(--bd);background:color-mix(in srgb,var(--c) 17%,var(--sf));transition:transform .25s var(--ez)}
.nc:active{transform:scale(.96)}.nc b{display:flex;gap:6px;align-items:center;margin-bottom:6px;overflow-wrap:anywhere}.nc b .i{color:var(--c)}
.nc p{font-size:14px;color:var(--mu);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:calc(var(--r,28px)*.8);padding:16px;margin-bottom:14px}
.card h3{font-size:15px;margin-bottom:10px}.prof{display:flex;align-items:center;gap:14px}
.prof .av{width:54px;height:54px;font-size:22px}.prof small{color:var(--mu);display:block;direction:ltr;text-align:right}
nav{position:fixed;bottom:0;inset-inline:0;background:color-mix(in srgb,var(--sf) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));z-index:4}
nav .pl{position:absolute;top:6px;bottom:calc(6px + env(safe-area-inset-bottom,0px));right:10px;width:calc((100% - 20px)/3);border-radius:16px;background:var(--tr);transform:translateX(calc(var(--i,0)*-100%));transition:transform .55s var(--ez)}
nav button{position:relative;background:none;border:0;padding:8px;font-size:12px;color:var(--mu);display:grid;justify-items:center;gap:3px}
nav button[aria-current=true]{color:var(--ac);font-weight:800}
.fab{position:fixed;inset-inline:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;background:var(--ac);color:var(--ax);border:0;border-radius:99px;padding:13px 26px;font-size:16px;font-weight:800;display:flex;gap:8px;align-items:center;box-shadow:0 10px 28px color-mix(in srgb,var(--ac) 40%,transparent);z-index:3;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.04)}}
.owl{position:fixed;inset-inline-start:14px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none}
.orb{pointer-events:auto;position:relative;width:50px;height:50px;border-radius:50%;border:0;color:var(--ax);display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--ac) 55%,#fff),var(--ac));box-shadow:0 6px 20px color-mix(in srgb,var(--ac) 45%,transparent);animation:breathe 5s ease-in-out infinite}
.orb::after{content:'';position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--ac);animation:ping 3.2s ease-out infinite}
.orb.sp::after{animation-duration:1s}
@keyframes ping{to{transform:scale(1.9);opacity:0}}
.bub{order:-1;max-width:230px;background:var(--sf);border:1px solid var(--ac);border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:14px;line-height:1.7;opacity:0;transform:scale(.8) translateY(10px);transform-origin:bottom right;transition:.4s var(--ez);pointer-events:none}
.bub.on{opacity:1;transform:none}
.ov{position:fixed;inset:0;background:rgba(10,14,20,.45);backdrop-filter:blur(3px);display:flex;align-items:flex-end;z-index:8;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.ov.on{opacity:1;visibility:visible}
.sh{width:100%;max-width:520px;margin:0 auto;background:var(--sf);border-radius:var(--r,28px) var(--r,28px) 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow-y:auto;transform:translateY(105%);transition:transform .55s var(--ez)}
.ov.on .sh{transform:none}
.sh h3{font-size:20px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:13px 2px 6px}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:calc(var(--r,28px)*.5);padding:12px;font:inherit;font-size:16px;transition:border-color .3s,box-shadow .3s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
textarea{resize:none}input[type=range]{padding:0;accent-color:var(--ac)}input[type=color]{cursor:pointer}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:8px 14px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed=true]{background:var(--ac);color:var(--ax);border-color:var(--ac)}
.sw{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid var(--bd)}.sw[aria-pressed=true]{outline:2px solid var(--ac);outline-offset:2px}
.save{width:100%;margin-top:18px;background:var(--ac);color:var(--ax);border:0;border-radius:calc(var(--r,28px)*.5);padding:14px;font-size:17px;font-weight:800}
.dng{background:none;color:#cf6a6a;border:1px solid #cf6a6a;margin-top:10px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:14px;margin:auto;max-width:480px;background:var(--ac);color:var(--ax);border-radius:18px;padding:12px 16px;font-weight:700;z-index:40;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 10px 28px rgba(0,0,0,.3);transform:translateY(-160%);transition:transform .5s var(--ez)}
.toast.on{transform:none}.toast button{background:var(--ax);color:var(--ac);border:0;border-radius:12px;padding:7px 12px;font-weight:800;flex:none}
.login{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;overflow-y:auto}.login.on{display:block}
.lw{max-width:380px;margin:0 auto;padding:50px 24px;text-align:center;display:grid;gap:12px}
.lw>*{animation:in .7s var(--ez) both}.lw>:nth-child(2){animation-delay:.1s}.lw>:nth-child(3){animation-delay:.2s}.lw>:nth-child(4){animation-delay:.3s}.lw>:nth-child(n+5){animation-delay:.4s}
.logo{color:var(--ac);display:grid;justify-items:center}.logo .i{animation:float 3.5s ease-in-out infinite}
.lw p{color:var(--mu);font-size:14px}.gb{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px;font-weight:700;font-size:16px}
.or{color:var(--mu);font-size:13px}.fine{font-size:12px!important;line-height:1.7}.x2{background:none;border:0;color:var(--mu);padding:8px;text-decoration:underline}
.cl{display:flex;flex-direction:column;gap:8px;max-height:42vh;overflow-y:auto;padding:4px 0}
.cm{max-width:86%;padding:10px 14px;line-height:1.75;font-size:15px;white-space:pre-wrap;border-radius:calc(var(--r,28px)*.6);animation:pop .4s var(--ez) both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.94)}}
.cm.b{background:var(--tr);align-self:flex-start}.cm.u{background:var(--ac);color:var(--ax);align-self:flex-end}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mu);margin:0 2px;animation:dt 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dt{40%{transform:translateY(-5px);opacity:.4}}
.ani :is(.it,.nc,.card,.day,.empty,.hero){animation:in .65s var(--d,0ms) var(--ez) both}
.ani header,.ani .sb{animation:in .55s var(--ez) both}
@keyframes in{from{opacity:0;transform:translateY(18px)}}
.cf{position:fixed;width:6px;height:6px;border-radius:50%;background:var(--ac);pointer-events:none;z-index:50;animation:cf .7s var(--ez) forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.shake{animation:sk .4s}@keyframes sk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.noan *,.noan *::after{animation:none!important;transition:none!important}
:root{--sfa:color-mix(in srgb,var(--sf) var(--op,62%),transparent)}
.hero,.it,.card{background:var(--sfa)}
.nc{background:color-mix(in srgb,var(--c) 17%,var(--sfa))}
nav{background:var(--sfa);backdrop-filter:none}
.sh{background:color-mix(in srgb,var(--sf) 97%,transparent)}
.ov{backdrop-filter:none}
.bgf i{filter:none;will-change:transform}
.ring .p{filter:none}
.hero{position:relative}
.hero.hot{box-shadow:none;animation:none}
.hero.hot::after{content:'';position:absolute;inset:-1px;border-radius:inherit;border:1px solid var(--ac);box-shadow:0 0 24px color-mix(in srgb,var(--ac) 30%,transparent);pointer-events:none;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.app{padding:calc(16px*var(--sp,1)) 18px 190px}
header,.sb{margin-bottom:calc(16px*var(--sp,1))}
.hero{padding:calc(20px*var(--sp,1));margin-bottom:calc(8px*var(--sp,1))}
.day{margin:calc(20px*var(--sp,1)) 4px calc(10px*var(--sp,1))}
.it{margin-bottom:calc(10px*var(--sp,1));padding:calc(11px*var(--sp,1)) 12px}
.notes{gap:calc(12px*var(--sp,1))}
.card{margin-bottom:calc(14px*var(--sp,1));padding:calc(16px*var(--sp,1))}
label{margin:calc(13px*var(--sp,1)) 2px 6px}
.lv{opacity:0;transform:translateX(calc(var(--dx,0px)*-1));transition:opacity .15s,transform .15s}
@keyframes in{from{opacity:0;transform:translate(var(--dx,0px),16px)}}
.cc{align-self:flex-start;animation:pop .4s var(--ez) both}
.hl{animation:hl 1.7s ease}
@keyframes hl{30%{box-shadow:0 0 0 3px var(--ac)}}
.bgf i{opacity:.36;animation:none;will-change:transform;transition:transform 1.4s var(--ez);transform:translate(calc(var(--mx,0)*38px),calc(var(--my,0)*38px + var(--sy,0px)))}
.bgf i:nth-child(2){background:radial-gradient(circle,color-mix(in srgb,var(--ac) 35%,#7c5cff),transparent 65%);transform:translate(calc(var(--mx,0)*-30px),calc(var(--my,0)*-30px + var(--sy,0px)))}
.bgf i:nth-child(3){width:42vmax;height:42vmax;top:34%;inset-inline-end:-12vmax;background:radial-gradient(circle,color-mix(in srgb,var(--ac) 35%,#ff8a5c),transparent 65%);transform:translate(calc(var(--mx,0)*-50px),calc(var(--my,0)*40px + var(--sy,0px)))}
.hero,.it,.card,.nc,.sh,.bub,nav{-webkit-backdrop-filter:blur(var(--bl,14px)) saturate(1.5);backdrop-filter:blur(var(--bl,14px)) saturate(1.5)}
.hero,.it,.card,.nc,nav{border-color:color-mix(in srgb,var(--tx) 11%,transparent);box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 24%,transparent),0 10px 26px -14px rgba(0,0,0,.22)}
nav{background:color-mix(in srgb,var(--sf) 78%,transparent)}
.sh{background:color-mix(in srgb,var(--sf) 86%,transparent)}
.bub{background:color-mix(in srgb,var(--sf) 80%,transparent)}
button{position:relative;overflow:hidden}
.orb{overflow:visible}
.it,.nc{overflow:hidden;touch-action:pan-y}
.hero,.it,.nc,.card{position:relative}
.rp{position:absolute;border-radius:50%;pointer-events:none;background:color-mix(in srgb,var(--ac) 38%,transparent);transform:scale(0);animation:rp .65s var(--ez) forwards}
@keyframes rp{to{transform:scale(1);opacity:0}}
.chip[aria-pressed=true] .rp,.save .rp,.fab .rp,.toast .rp{background:color-mix(in srgb,#fff 40%,transparent)}
.it::before,.nc::before,.card::before,.hero::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(200px circle at var(--px,50%) var(--py,50%),color-mix(in srgb,var(--ac) 20%,transparent),transparent 72%)}
.it:hover::before,.nc:hover::before,.card:hover::before,.hero:hover::before,.pr::before{opacity:1}
.hero{transition:transform .4s var(--ez),box-shadow .6s}
@media (hover:hover){.it:hover,.nc:hover{transform:translateY(-2px)}}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;padding:8px 6px;margin-inline:-6px;border-radius:20px;transition:background .35s,box-shadow .35s,padding .3s}
body.sc header{background:color-mix(in srgb,var(--sf) 70%,transparent);-webkit-backdrop-filter:blur(var(--bl,14px)) saturate(1.5);backdrop-filter:blur(var(--bl,14px)) saturate(1.5);box-shadow:0 8px 24px -14px rgba(0,0,0,.3);padding:4px 10px}

.it.done .ck{animation:ckp .45s var(--ez)}

</head>
<body>
<div class="bgf"><i></i><i></i><i></i></div>

<div class="login" id="login"><div class="lw">
  <div class="logo" id="lg"></div><h1>مواعيدي</h1><p>مواعيدك وملاحظاتك بمكان واحد، بهدوء</p>
  <button class="gb" data-a="g">المتابعة مع Google</button>

function pop(el){const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;for(let i=0;i<8;i++){const s=document.createElement('i'),a=i*Math.PI/4;s.className='cf';s.style.cssText=`left:${x}px;top:${y}px;--x:${Math.cos(a)*38}px;--y:${Math.sin(a)*38}px`;document.body.appendChild(s);setTimeout(()=>s.remove(),700)}}

  ic:v=>{icon=v;pr('#icons button',v)},
  tpl:v=>{const t=TPL[v];$('ti').value=t[1];icon=t[0];pr('#icons button',icon);$('tv').value=t[2].trav||0;$('rp').value=t[2].rep||'';
    if(t[2].tm){const[h,m]=t[2].tm.split(':'),d=new Date();d.setHours(h,m,0,0);if(d<=Date.now())d.setDate(d.getDate()+1);$('dt').value=dstr(d);$('tm').value=t[2].tm}},
  qk:v=>{const d=new Date();if(v=='tm'){d.setDate(d.getDate()+1);d.setHours(8,0,0,0)}else d.setTime(Date.now()+v*6e4);$('dt').value=dstr(d);$('tm').value=pad(d.getHours())+':'+pad(d.getMinutes())},
  sv:()=>{const t=$('ti').value.trim();if(!t){$('ti').classList.add('shake');setTimeout(()=>$('ti').classList.remove('shake'),400);return}
    const ts=new Date($('dt').value+'T'+$('tm').value).getTime();if(isNaN(ts))return;
    const o={title:t,icon,ts,trav:+$('tv').value,lead:+$('ld').value,rep:$('rp').value,note:$('nt').value.trim(),al:$('alb').getAttribute('aria-pressed')=='true'?1:0,done:false,nt:false,sn:0};
    if(ed)Object.assign(ed,o);else{o.id=Date.now();S.items.push(o);ctx.last=o.id}
    learnP(o);save();closeSh();anim=true;draw();say(ed?'تمام عدّلتو':'تمام، ضفتو ورح ذكّرك بالوقت المناسب');
    try{if('Notification' in window&&Notification.permission=='default')Notification.requestPermission()}catch(e){}},
  rm:()=>{const i=ed;closeSh();rmItem(i);toast('انحذف الموعد')},
  nc:v=>{nclr=+v;pr('#ncs .sw',v)},
  np:()=>{npin=!npin;$('npn').setAttribute('aria-pressed',npin)},
  nsv:()=>{const t=$('nti').value.trim(),b=$('nbd').value.trim();if(!t&&!b)return;
    const o={t,b,c:nclr,pin:npin,ts:Date.now()};if(ed)Object.assign(ed,o);else S.notes.push(Object.assign({id:Date.now()},o));
    save();closeSh();anim=true;draw();say('انحفظت الملاحظة')},
  nrm:()=>{S.notes=S.notes.filter(i=>i!==ed);save();closeSh();anim=true;draw()},
  sn:v=>{clearInterval(rg);const i=S.items.find(x=>x.id==v);if(i){i.nt=false;i.sn=Date.now()+3e5;save()}$('toast').classList.remove('on');say('تمام، رح ذكّرك بعد ٥ دقايق')},
  alt:()=>{const b=$('alb');b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!='true')},
  stop:v=>{clearInterval(rg);$('toast').classList.remove('on');const i=S.items.find(x=>x.id==v);if(i){if(i.rep){i.ts=nxt(i);i.nt=false}else i.done=true;save();draw()}},
  goto:v=>{const f=FE[v];closeSh();if(f.form){setTimeout(()=>apForm(),300);return}go(f.tab);if(f.id)setTimeout(()=>{const e=$(f.id);if(e){e.scrollIntoView({behavior:'smooth',block:'center'});e.classList.add('hl');setTimeout(()=>e.classList.remove('hl'),1800)}},750)},
  th:v=>{vt(()=>{S.set.theme=v;if(v=='custom'&&!S.set.cu)S.set.cu=Object.assign({},CU);save();applyTheme();sett()})},
  acp:v=>{vt(()=>{S.set.ac=v||null;save();applyTheme();sett()})},
  ff:v=>{S.set.ff=v;save();applyTheme();sett();try{document.fonts.load('16px '+((FONTS[v]||'Tajawal').split(',')[0]))}catch(e){}},
  gp:v=>{S.set.gp=v;save();applyTheme();sett()},
  an:()=>{S.set.an=S.set.an===false;save();applyTheme();sett()},
  rd:()=>{['ac','r','fs','ff','gp','an','cu','op','sp','bl'].forEach(k=>delete S.set[k]);S.set.theme='auto';save();applyTheme();sett();toast('رجع التصميم الأصلي')},
  tgl:v=>{S.set[v]=v=='hap'?S.set.hap===false:!S.set[v];save();sett();if(v=='owl'&&S.set.owl)say('رجعت')},
  notif:()=>{try{Notification.requestPermission().then(sett)}catch(e){toast('جهازك ما بيدعم الإشعارات هون')}},
  unl:()=>{S.learn={al:{},ph:{},p:{}};save();sett();toast('انمسح ما تعلّمه المساعد')},
  copy:()=>{try{navigator.clipboard.writeText(JSON.stringify({items:S.items,notes:S.notes}));toast('انسخت النسخة الاحتياطية')}catch(e){toast('ما قدرت أنسخ')}},
  wipe:(v,b)=>{if(!b.dataset.s){b.dataset.s=1;b.textContent='متأكد؟ اضغط كمان مرة';return}S.items=[];S.notes=[];save();anim=true;draw();toast('انمسح كل شي')},
  out:()=>{S.user=null;save();$('login').classList.add('on')},
  owl:()=>chat(),
  cq:v=>ask(v),
  cs:()=>{const i=$('ci');if(i.value.trim()){ask(i.value.trim());i.value=''}},
  g:()=>{$('lm').textContent='تسجيل Google الحقيقي بيشتغل بنسخة الـ APK. هلأ سجّل بالإيميل أو كمّل كضيف.'},
  em:()=>{const e=$('le').value.trim(),n=$('ln').value.trim();
    if(!/^\S+@\S+\.\S+$/.test(e)){$('le').classList.add('shake');setTimeout(()=>$('le').classList.remove('shake'),400);return}
    S.user={name:n||e.split('@')[0],email:e};save();start()},
  gu:()=>{S.user={name:'',email:''};save();start()}
};
document.addEventListener('click',e=>{if(swd)return;idle=Date.now();const b=e.target.closest('[data-a]');if(b){hap();tk();act[b.dataset.a](b.dataset.v,b,e)}else if(e.target==$('ov'))closeSh()});
document.addEventListener('change',e=>{const s=e.target.dataset.s;if(s){S.set[s]=+e.target.value;save()}
  if(e.target.id=='ti'&&!ed){const p=S.learn.p[N2(e.target.value)];if(p){icon=p.icon;pr('#icons button',icon);$('tv').value=p.trav;$('ld').value=p.lead;$('rp').value=p.rep;$('tm').value=p.tm;toast('طبّقت إعداداتك المعتادة لهالموعد')}}});
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;const v=e.target.value;
  if(k.startsWith('cu_'))S.set.cu=Object.assign({},CU,S.set.cu,{[k.slice(3)]:v});else if(k=='tp')S.set.op=100-v;else S.set[k]=['r','fs','sp','bl'].includes(k)?+v:v;
  save();applyTheme()});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='ci')act.cs()});
$('q').addEventListener('input',()=>{idle=Date.now();const n=tab=='a'?listA():listN();clearTimeout(st);const q=$('q').value.trim();
  if(q)st=setTimeout(()=>say(n?['شكلك عم تدوّر على شي، لقيتلك '+n+' نتيجة','عم تدوّر على «'+q+'»؟ هي النتائج'][n%2]:'ما لقيت شي بهالاسم، جرّب كلمة تانية أو قلّي أضيفو'),1300)});

function check(){
  const n=Date.now();let ch=0;
  S.items.forEach(i=>{
    if(i.ad&&n>=i.ad){i.ad=0;rmItem(i);return}
    if(i.rep&&i.ts<n-72e5&&!i.sn){while(i.ts<n-72e5)i.ts=nxt(i);i.nt=false;i.done=false;ch=1}
    const at=i.sn||i.ts-(i.trav+i.lead)*6e4;
    if(!i.done&&!i.nt&&n>=at&&(i.sn||n<i.ts+72e5)){
      i.nt=true;i.sn=0;ch=1;
      const m=i.trav&&n>=i.ts-i.trav*6e4?`${i.title}: وقت الطلوع`:i.ts>n?`${i.title} — باقي ${left(i.ts-n)}`:`${i.title} — هلأ`;
      toast(m,i.id,i.al);say(m,9000);i.al?ring():beep();ctx.last=i.id;
      try{if(Notification.permission=='granted')new Notification('مواعيدي',{body:m})}catch(e){}
      try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
      if(i.del){i.del=0;setTimeout(()=>rmItem(i),5000)}}});
  if(ch){save();draw()}else if(tab=='a')hero();
}
setInterval(()=>{check();applyTheme();
  if(Date.now()-idle>75000&&S.user){idle=Date.now();const l=S.items.filter(i=>!i.done&&i.ts<Date.now()&&!i.rep).length;
    say(l?'في '+l+' موعد فات وما خلّصتو، شوف القائمة':TIPS[Math.floor(Math.random()*TIPS.length)])}},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});

function start(){
  $('login').classList.remove('on');applyTheme();anim=true;draw();check();
  const n=S.items.filter(i=>!i.done&&i.ts>Date.now()&&dstr(new Date(i.ts))==dstr(new Date())).length;
  setTimeout(()=>say(n?`أهلين، عندك ${n} ${n>2?'مواعيد':'موعد'} اليوم وأنا معك`:'أهلين، يومك فاضي. ضيف شي أو ارتاح'),900);
}
applyTheme();if(S.user)start();else{$('login').classList.add('on');draw()}
</script>
<script src="native.js"></script>
</body>
